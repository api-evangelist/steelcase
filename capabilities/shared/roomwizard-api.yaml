naftiko: "1.0.0-alpha1"

info:
  label: "Steelcase RoomWizard API"
  description: "Steelcase RoomWizard API for conference room scheduling, availability, and booking management integrated with enterprise calendaring systems."
  tags:
    - Room Scheduling
    - Conference Rooms
    - Workplace
    - Facilities Management
    - Calendaring
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys: {}

capability:
  consumes:
    - type: http
      namespace: steelcase-roomwizard
      baseUri: https://roomwizard.local:443/api
      description: "Steelcase RoomWizard Connector API for room booking management."
      resources:
        - name: bookings
          path: /get_bookings
          description: "Conference room bookings."
          operations:
            - name: get-bookings
              method: GET
              description: "Returns room bookings optionally filtered by room or date range."
              inputParameters:
                - name: room_id
                  in: query
                  type: string
                  required: false
                  description: "Filter by room ID."
                - name: start_date
                  in: query
                  type: string
                  required: false
                  description: "Start date (YYYY-MM-DD)."
                - name: end_date
                  in: query
                  type: string
                  required: false
                  description: "End date (YYYY-MM-DD)."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-booking
              method: POST
              description: "Creates a new conference room booking."
              body:
                type: json
                data:
                  room_id: "{{tools.room_id}}"
                  subject: "{{tools.subject}}"
                  organizer: "{{tools.organizer}}"
                  start_time: "{{tools.start_time}}"
                  end_time: "{{tools.end_time}}"
                  attendee_count: "{{tools.attendee_count}}"
                  notes: "{{tools.notes}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: cancel-booking
              method: POST
              description: "Cancels an existing room booking."
              body:
                type: json
                data:
                  booking_id: "{{tools.booking_id}}"
                  reason: "{{tools.reason}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: availability
          path: /get_availability
          description: "Room availability."
          operations:
            - name: get-room-availability
              method: GET
              description: "Returns room availability for a time range."
              inputParameters:
                - name: room_id
                  in: query
                  type: string
                  required: false
                  description: "Specific room ID."
                - name: start_time
                  in: query
                  type: string
                  required: true
                  description: "Start of availability window (ISO 8601)."
                - name: end_time
                  in: query
                  type: string
                  required: true
                  description: "End of availability window (ISO 8601)."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: rooms
          path: /get_rooms
          description: "Conference rooms."
          operations:
            - name: list-rooms
              method: GET
              description: "Returns all RoomWizard-managed conference rooms."
              inputParameters:
                - name: building
                  in: query
                  type: string
                  required: false
                  description: "Filter by building."
                - name: floor
                  in: query
                  type: string
                  required: false
                  description: "Filter by floor."
                - name: min_capacity
                  in: query
                  type: integer
                  required: false
                  description: "Minimum room capacity."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-room
              method: GET
              description: "Returns details for a specific room."
              inputParameters:
                - name: room_id
                  in: query
                  type: string
                  required: true
                  description: "Room identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: status
          path: /status
          description: "Connector health status."
          operations:
            - name: get-connector-status
              method: GET
              description: "Returns the health and connectivity status of the RoomWizard connector."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: steelcase-roomwizard-rest
      resources:
        - path: /v1/bookings
          name: bookings
          description: "Conference room bookings."
          operations:
            - method: GET
              name: get-bookings
              description: "Get room bookings filtered by room or date range."
              call: "steelcase-roomwizard.get-bookings"
              with:
                room_id: "rest.room_id"
                start_date: "rest.start_date"
                end_date: "rest.end_date"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-booking
              description: "Create a new conference room booking."
              call: "steelcase-roomwizard.create-booking"
              with:
                room_id: "rest.room_id"
                subject: "rest.subject"
                organizer: "rest.organizer"
                start_time: "rest.start_time"
                end_time: "rest.end_time"
                attendee_count: "rest.attendee_count"
                notes: "rest.notes"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/bookings/{booking_id}/cancel
          name: cancel-booking
          description: "Cancel a booking."
          operations:
            - method: POST
              name: cancel-booking
              description: "Cancel an existing booking."
              call: "steelcase-roomwizard.cancel-booking"
              with:
                booking_id: "rest.booking_id"
                reason: "rest.reason"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/availability
          name: availability
          description: "Room availability."
          operations:
            - method: GET
              name: get-availability
              description: "Get room availability for a time window."
              call: "steelcase-roomwizard.get-room-availability"
              with:
                room_id: "rest.room_id"
                start_time: "rest.start_time"
                end_time: "rest.end_time"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/rooms
          name: rooms
          description: "Conference rooms."
          operations:
            - method: GET
              name: list-rooms
              description: "List all conference rooms."
              call: "steelcase-roomwizard.list-rooms"
              with:
                building: "rest.building"
                floor: "rest.floor"
                min_capacity: "rest.min_capacity"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: steelcase-roomwizard-mcp
      transport: http
      tools:
        - name: list-bookings
          description: "Get conference room bookings for a specific room or date range."
          hints:
            readOnly: true
            openWorld: false
          call: "steelcase-roomwizard.get-bookings"
          with:
            room_id: "tools.room_id"
            start_date: "tools.start_date"
            end_date: "tools.end_date"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-booking
          description: "Create a new conference room booking."
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "steelcase-roomwizard.create-booking"
          with:
            room_id: "tools.room_id"
            subject: "tools.subject"
            organizer: "tools.organizer"
            start_time: "tools.start_time"
            end_time: "tools.end_time"
            attendee_count: "tools.attendee_count"
            notes: "tools.notes"
          outputParameters:
            - type: object
              mapping: "$."

        - name: cancel-booking
          description: "Cancel an existing conference room booking."
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "steelcase-roomwizard.cancel-booking"
          with:
            booking_id: "tools.booking_id"
            reason: "tools.reason"
          outputParameters:
            - type: object
              mapping: "$."

        - name: check-room-availability
          description: "Check availability for one or all conference rooms during a time window."
          hints:
            readOnly: true
            openWorld: false
          call: "steelcase-roomwizard.get-room-availability"
          with:
            room_id: "tools.room_id"
            start_time: "tools.start_time"
            end_time: "tools.end_time"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-rooms
          description: "List all conference rooms managed by RoomWizard, optionally filtered by building, floor, or capacity."
          hints:
            readOnly: true
            openWorld: true
          call: "steelcase-roomwizard.list-rooms"
          with:
            building: "tools.building"
            floor: "tools.floor"
            min_capacity: "tools.min_capacity"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-room-details
          description: "Get detailed information about a specific conference room."
          hints:
            readOnly: true
            openWorld: false
          call: "steelcase-roomwizard.get-room"
          with:
            room_id: "tools.room_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-connector-status
          description: "Get health and connectivity status of the RoomWizard connector service."
          hints:
            readOnly: true
            openWorld: false
          call: "steelcase-roomwizard.get-connector-status"
          outputParameters:
            - type: object
              mapping: "$."
