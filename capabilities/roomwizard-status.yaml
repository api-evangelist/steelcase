naftiko: 1.0.0-alpha2
info:
  label: Steelcase RoomWizard API — Status
  description: 'Steelcase RoomWizard API — Status. 1 operations. Lead operation: Get Connector Status. Self-contained Naftiko
    capability covering one Steelcase business surface.'
  tags:
  - Steelcase
  - Status
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    STEELCASE_API_KEY: STEELCASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: roomwizard-status
    baseUri: https://{host}:{port}/api
    description: Steelcase RoomWizard API — Status business capability. Self-contained, no shared references.
    resources:
    - name: status
      path: /status
      operations:
      - name: getconnectorstatus
        method: GET
        description: Get Connector Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: roomwizard-status-rest
    port: 8080
    description: REST adapter for Steelcase RoomWizard API — Status. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/status
      name: status
      description: REST surface for status.
      operations:
      - method: GET
        name: getconnectorstatus
        description: Get Connector Status
        call: roomwizard-status.getconnectorstatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: roomwizard-status-mcp
    port: 9090
    transport: http
    description: MCP adapter for Steelcase RoomWizard API — Status. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-connector-status
      description: Get Connector Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: roomwizard-status.getconnectorstatus
      outputParameters:
      - type: object
        mapping: $.
