aid: steelcase
name: Steelcase
description: >-
  Steelcase is a global leader in the office furniture and workplace design industry, providing furniture, technology,
  and research-based insights to help organizations create effective work environments. Steelcase offers the RoomWizard
  API for integrating room scheduling and conference room reservation systems with enterprise calendaring platforms. The
  API enables developers to manage room bookings, retrieve availability, and synchronize reservations with Microsoft
  Exchange, Office 365, and Google Calendar.
